services:
  api:
    build: .
    container_name: fatoorahai
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PADDLE_PDX_CACHE_HOME=/models
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
    volumes:
      - ./app:/code/app
      - paddle_models:/models
    depends_on:
      - ollama
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  paddle_models:
  ollama_models: